<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Background Remover</title>
<style>
  :root{
    --bg:#0f0f10; --panel:#161618; --line:#2a2a2e; --txt:#e8e8ea; --muted:#8b8b93;
    --accent:#4f8cff; --accent2:#2f6fe0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--txt); overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{display:flex; height:100%}
  #sidebar{
    width:272px; flex:0 0 272px; background:var(--panel);
    border-right:1px solid var(--line); padding:16px;
    display:flex; flex-direction:column; gap:16px; overflow-y:auto;
    overscroll-behavior:contain;
  }
  #sidebar h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px}
  .hint{font-size:12px; color:var(--muted); margin:6px 0 0}
  .group{display:flex; flex-direction:column; gap:8px}
  .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em}
  .btn{
    appearance:none; border:1px solid var(--line); background:#1e1e22; color:var(--txt);
    padding:9px 12px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer;
    transition:background .15s, border-color .15s, opacity .15s; text-align:center;
    font-family:inherit; user-select:none;
  }
  .btn:hover:not(:disabled){background:#26262b; border-color:#3a3a41}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent2); border-color:var(--accent2)}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row .btn{flex:1 1 0}
  .tool,.mode{padding:8px 0; font-size:12px; min-width:60px}
  .tool.active,.mode.active{background:var(--accent); border-color:var(--accent); color:#fff}
  input[type=range]{width:100%; accent-color:var(--accent); cursor:pointer; touch-action:manipulation}
  .filename-input{
    appearance:none; border:1px solid var(--line); background:#1e1e22; color:var(--txt);
    padding:9px 12px; border-radius:9px; font-size:13px; font-family:inherit;
    width:100%; min-width:0; user-select:text;
  }
  .filename-input:focus{
    outline:none; border-color:var(--accent); background:#1a1a20;
  }
  .filename-input:disabled{ opacity:.4; cursor:not-allowed; }
  #status{font-size:12px; color:var(--muted); min-height:34px; white-space:pre-wrap; line-height:1.45}

  #viewport{
    position:relative; flex:1; overflow:hidden; touch-action:none; cursor:grab;
    background-color:#1a1a1d;
    background-image:
      linear-gradient(45deg,#232327 25%,transparent 25%),
      linear-gradient(-45deg,#232327 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#232327 75%),
      linear-gradient(-45deg,transparent 75%,#232327 75%);
    background-size:22px 22px;
    background-position:0 0, 0 11px, 11px -11px, -11px 0;
  }
  #view{position:absolute; inset:0; display:block}
  #overlay{position:absolute; inset:0; display:block; pointer-events:none}
  #drop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; pointer-events:none; color:var(--muted); font-size:13px;
    text-align:center; padding:16px;
  }
  #drop b{color:#c9c9cf; font-weight:600; font-size:15px}
  #drop.hide{display:none}

  @media (max-width: 820px), (pointer: coarse) {
    #app { flex-direction: column; }
    #viewport { order: 1; flex: 1 1 auto; min-height: 0; }
    #sidebar {
      order: 2; width: 100%; flex: 0 0 auto; max-height: 45vh;
      overflow-y: auto; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      gap: 8px; border-right: none; border-top: 1px solid var(--line);
      flex-direction: column;
    }
    #sidebar h1, #sidebar .hint { display: none; }
    .group { flex-direction: row; flex-wrap: wrap; gap: 6px; align-items: center; }
    .group .label { margin: 0; font-size: 11px; text-transform: none; letter-spacing: 0; }
    .group:has(.tool) .label, .group:has(.mode) .label { display: none; }
    .row { flex: 1 1 auto; }
    .btn { min-height: 42px; padding: 8px 10px; font-size: 12px; flex: 1 1 0; }
    .tool, .mode { padding: 10px 6px; flex: 1 1 0; }
    #size { flex: 1 1 auto; min-width: 80px; }
    #status { min-height: 16px; font-size: 11px; flex-basis: 100%; }
    #overlay { opacity: .95; }

    .download-group { flex-wrap: nowrap; }
    .download-group .label { display: none; }
    .download-group .filename-input { flex: 1 1 auto; min-width: 0; min-height: 42px; }
    .download-group .btn { flex: 0 0 auto; min-height: 42px; }
  }
  @media (max-height: 640px) and (max-width: 820px) {
    #sidebar { max-height: 40vh; padding: 8px 10px 10px; gap: 6px; }
    .btn { min-height: 38px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div>
      <h1>Background Remover</h1>
      <p class="hint">Auto-select or paint a mask → Keep (reveal) or Hide (remove) → Apply.</p>
    </div>

    <div class="group">
      <label class="btn primary" for="file">Choose image…</label>
      <input id="file" type="file" accept="image/*" hidden />
      <button id="autoSelectBtn" class="btn" disabled>Auto-Select Subject</button>
      <button id="removeBtn" class="btn" disabled>Remove Background</button>
      <button id="clearMaskBtn" class="btn" disabled>Clear mask</button>
    </div>

    <div class="group download-group">
      <div class="label">Download name</div>
      <input id="filename" class="filename-input" type="text" value="background-removed" spellcheck="false" autocomplete="off" disabled />
      <button id="downloadBtn" class="btn" disabled>Download PNG</button>
    </div>

    <div class="group">
      <div class="label">Mask mode</div>
      <div class="row">
        <button class="btn mode active" data-mode="keep">Keep masked</button>
        <button class="btn mode" data-mode="hide">Hide masked</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Tool</div>
      <div class="row">
        <button class="btn tool" data-tool="mask">Mask</button>
        <button class="btn tool active" data-tool="pan">Pan</button>
        <button class="btn tool" data-tool="erase">Erase</button>
        <button class="btn tool" data-tool="restore">Restore</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Brush size — <span id="sizeVal">60</span> px</div>
      <input id="size" type="range" min="4" max="400" step="1" value="60" />
    </div>

    <div class="group">
      <button id="fitBtn" class="btn" disabled>Fit to view</button>
      <button id="resetBtn" class="btn" disabled>Reset edits</button>
    </div>

    <div id="status"></div>
  </aside>

  <main id="viewport">
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <div id="drop"><b>Drop an image here</b><span>or paste from clipboard</span></div>
  </main>
</div>

<script type="module">
/* =====================================================================
   RENAME ON DOWNLOAD
   =====================================================================
   ✔ Editable filename input, prefilled from the source image name
     ("photo.jpg" → "photo-removed").
   ✔ Sanitizes illegal characters, strips any image extension the user
     might have typed, and always appends ".png".
   ✔ Enter key inside the field triggers the download for convenience.
   ✔ All prior features retained (auto-select, keep/hide, validation,
     crop-to-bbox, dilation/feathering, mobile, pinch-zoom).
   ===================================================================== */

const viewport    = document.getElementById('viewport');
const view        = document.getElementById('view');
const vctx        = view.getContext('2d');
const overlay     = document.getElementById('overlay');
const octx        = overlay.getContext('2d');
const fileInput   = document.getElementById('file');
const autoSelectBtn = document.getElementById('autoSelectBtn');
const removeBtn   = document.getElementById('removeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const filenameInput = document.getElementById('filename');
const resetBtn    = document.getElementById('resetBtn');
const fitBtn      = document.getElementById('fitBtn');
const clearMaskBtn= document.getElementById('clearMaskBtn');
const sizeInput   = document.getElementById('size');
const sizeVal     = document.getElementById('sizeVal');
const statusEl    = document.getElementById('status');
const dropHint    = document.getElementById('drop');
const toolBtns    = Array.from(document.querySelectorAll('.tool'));
const modeBtns    = Array.from(document.querySelectorAll('.mode'));

const MAX_DIM          = 2048;
const MAX_BRUSH_IM     = 600;
const MASK_TINT        = 'rgba(0, 200, 255, 1)';
const DILATE_PX        = 3;
const FEATHER_PX       = 2;
const AI_CROP_PADDING  = 64;
const CROP_THRESHOLD   = 0.80;
const AI_MIN_OPAQUE    = 0.05;
const FB_MIN_TRANSPARENT = 0.005;
const DEFAULT_DOWNLOAD_NAME = 'background-removed';

let origCanvas = null;
let workCanvas = null;
let maskCanvas = null;
let hasImage   = false;
let maskPainted= false;
let busy       = false;
let maskMode   = 'keep';

let scale = 1, tx = 0, ty = 0;
let dpr = Math.max(1, window.devicePixelRatio || 1);

let tool      = 'pan';
let brushSize = 60;
let drawing   = false;
let panning   = false;
let lastPt    = null;
let panStart  = null;
let cursor    = null;
let spaceDown = false;
let rafPending = false;
let fitRaf     = null;

const activePointers = new Map();
let primaryPointerId = null;
let pinchState = null;

/* =====================================================================
   HELPERS
   ===================================================================== */
function setStatus(msg){ statusEl.textContent = msg; }

function removeBtnLabel(){
  if (!maskPainted) return 'Remove Background';
  return maskMode === 'hide' ? 'Remove Masked Subject' : 'Process Masked Area';
}

function buildDefaultFilename(originalName){
  if (!originalName) return DEFAULT_DOWNLOAD_NAME;
  const base = originalName.replace(/\.[^/.]+$/, '').trim();
  if (!base) return DEFAULT_DOWNLOAD_NAME;
  return base + '-removed';
}

function sanitizeFilename(name){
  let n = (name || '').trim();
  n = n.replace(/[\\\/:*?"<>|]/g, '-');       // strip filesystem-unsafe chars
  n = n.replace(/\s+/g, ' ');                  // collapse whitespace
  n = n.replace(/\.(png|jpe?g|webp|gif|bmp)$/i, ''); // strip any image ext
  n = n.trim();
  if (!n) n = DEFAULT_DOWNLOAD_NAME;
  return n + '.png';
}

function loadImageEl(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function updateUI(){
  removeBtn.disabled    = !hasImage || busy;
  autoSelectBtn.disabled= !hasImage || busy;
  downloadBtn.disabled  = !hasImage;
  filenameInput.disabled= !hasImage;
  resetBtn.disabled     = !hasImage;
  fitBtn.disabled       = !hasImage;
  clearMaskBtn.disabled = !maskPainted;
  dropHint.classList.toggle('hide', hasImage);
  if (!busy) removeBtn.textContent = removeBtnLabel();
}

function setBusyUI(b){
  removeBtn.disabled    = b || !hasImage;
  autoSelectBtn.disabled= b || !hasImage;
  removeBtn.textContent = b ? 'Working…' : removeBtnLabel();
}

function clampBrushImage(){
  const rad = brushSize / (2 * Math.max(scale, 0.001));
  return Math.min(rad, MAX_BRUSH_IM);
}

function scheduleRender(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    render();
    renderOverlay();
  });
}

function makeProgressHandler(){
  let lastPct = -1;
  return (_key, current, total) => {
    if (total > 0){
      const pct = Math.round((current / total) * 100);
      if (pct !== lastPct){ lastPct = pct; setStatus('Processing… ' + pct + '%'); }
    }
  };
}

/* =====================================================================
   RENDER / VIEW TRANSFORM
   ===================================================================== */
function resize(){
  const r = viewport.getBoundingClientRect();
  dpr = Math.max(1, window.devicePixelRatio || 1);

  const oldW = viewport.clientWidth;
  const oldH = viewport.clientHeight;
  const cx = oldW / 2, cy = oldH / 2;
  const imgCx = (cx - tx) / scale;
  const imgCy = (cy - ty) / scale;

  view.width  = Math.max(1, Math.round(r.width  * dpr));
  view.height = Math.max(1, Math.round(r.height * dpr));
  view.style.width  = r.width  + 'px';
  view.style.height = r.height + 'px';

  overlay.width  = view.width;
  overlay.height = view.height;
  overlay.style.width  = r.width  + 'px';
  overlay.style.height = r.height + 'px';

  if (hasImage && (oldW !== r.width || oldH !== r.height)){
    tx = r.width  / 2 - imgCx * scale;
    ty = r.height / 2 - imgCy * scale;
  }

  render();
  renderOverlay();
}

function render(){
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vctx.clearRect(0, 0, w, h);
  if (hasImage){
    vctx.save();
    vctx.translate(tx, ty);
    vctx.scale(scale, scale);
    vctx.imageSmoothingEnabled = scale < 1;
    vctx.imageSmoothingQuality = 'high';
    vctx.drawImage(workCanvas, 0, 0);
    vctx.restore();
  }
}

function renderOverlay(){
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, w, h);

  if (tool === 'mask' && hasImage && maskCanvas && maskPainted){
    octx.save();
    octx.translate(tx, ty);
    octx.scale(scale, scale);
    octx.globalAlpha = 0.5;
    octx.drawImage(maskCanvas, 0, 0);
    octx.restore();
  }

  if (cursor && hasImage && tool !== 'pan'){
    const rad = Math.max(2, brushSize / 2);
    octx.save();
    octx.beginPath();
    octx.arc(cursor.x, cursor.y, rad, 0, Math.PI * 2);
    octx.lineWidth = 3;
    octx.strokeStyle = 'rgba(0,0,0,.55)';
    octx.stroke();
    octx.beginPath();
    octx.arc(cursor.x, cursor.y, rad, 0, Math.PI * 2);
    octx.lineWidth = 1.5;
    octx.strokeStyle = tool === 'mask' ? 'rgba(0,200,255,.95)' : 'rgba(255,255,255,.95)';
    octx.stroke();
    octx.restore();
  }
}

function fitView(){
  if (!hasImage) return;
  if (fitRaf) cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(() => {
    fitRaf = null;
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const s = Math.min(w / workCanvas.width, h / workCanvas.height) * 0.92;
    scale = s;
    tx = (w - workCanvas.width  * s) / 2;
    ty = (h - workCanvas.height * s) / 2;
    render();
    renderOverlay();
  });
}

function toImage(clientX, clientY){
  const r = viewport.getBoundingClientRect();
  return {
    x: (clientX - r.left - tx) / scale,
    y: (clientY - r.top  - ty) / scale
  };
}

/* =====================================================================
   MASK PROCESSING HELPERS
   ===================================================================== */
function dilateAndFeatherMask(){
  if (!maskCanvas || !maskPainted) return null;
  const w = maskCanvas.width, h = maskCanvas.height;

  const dilated = document.createElement('canvas');
  dilated.width = w; dilated.height = h;
  const dctx = dilated.getContext('2d');

  const steps = 8;
  dctx.drawImage(maskCanvas, 0, 0);
  for (let i = 0; i < steps; i++){
    const ang = (i / steps) * Math.PI * 2;
    dctx.drawImage(maskCanvas, Math.cos(ang) * DILATE_PX, Math.sin(ang) * DILATE_PX);
  }

  const feathered = document.createElement('canvas');
  feathered.width = w; feathered.height = h;
  const fctx = feathered.getContext('2d');
  fctx.filter = `blur(${FEATHER_PX}px)`;
  fctx.drawImage(dilated, 0, 0);
  fctx.filter = 'none';

  return feathered;
}

function getMaskBoundingBox(padding){
  if (!maskCanvas || !maskPainted) return null;
  const w = maskCanvas.width, h = maskCanvas.height;
  const data = maskCanvas.getContext('2d').getImageData(0, 0, w, h).data;

  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y += 2){
    for (let x = 0; x < w; x += 2){
      if (data[(y * w + x) * 4 + 3] > 10){
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;

  minX = Math.max(0, minX - padding);
  minY = Math.max(0, minY - padding);
  maxX = Math.min(w - 1, maxX + padding);
  maxY = Math.min(h - 1, maxY + padding);
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function hasOpaqueInsideMask(resultCanvas, checkMask, threshold){
  const w = resultCanvas.width, h = resultCanvas.height;
  const rData = resultCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const mData = checkMask.getContext('2d').getImageData(0, 0, w, h).data;

  let maskCount = 0, opaqueCount = 0;
  for (let i = 0; i < w * h; i += 4){
    if (mData[i + 3] > 50){
      maskCount++;
      if (rData[i + 3] > 50) opaqueCount++;
    }
  }
  if (maskCount === 0) return true;
  return (opaqueCount / maskCount) >= threshold;
}

function hasTransparentInsideMask(resultCanvas, checkMask, threshold){
  const w = resultCanvas.width, h = resultCanvas.height;
  const rData = resultCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const mData = checkMask.getContext('2d').getImageData(0, 0, w, h).data;

  let maskCount = 0, transparentCount = 0;
  for (let i = 0; i < w * h; i += 4){
    if (mData[i + 3] > 50){
      maskCount++;
      if (rData[i + 3] < 50) transparentCount++;
    }
  }
  if (maskCount === 0) return true;
  return (transparentCount / maskCount) >= threshold;
}

function getCurrentAlphaMask(){
  const w = workCanvas.width, h = workCanvas.height;
  const mask = document.createElement('canvas');
  mask.width = w; mask.height = h;
  const mctx = mask.getContext('2d');
  mctx.fillStyle = '#fff';
  mctx.fillRect(0, 0, w, h);
  mctx.globalCompositeOperation = 'destination-in';
  mctx.drawImage(workCanvas, 0, 0);
  return mask;
}

function compositeWithMask(sourceCanvas, processingMask){
  const c = workCanvas.getContext('2d');
  const w = workCanvas.width, h = workCanvas.height;

  if (!processingMask){
    c.clearRect(0, 0, w, h);
    c.drawImage(sourceCanvas, 0, 0, w, h);
    return;
  }

  const temp = document.createElement('canvas');
  temp.width = w; temp.height = h;
  const tctx = temp.getContext('2d');
  tctx.drawImage(sourceCanvas, 0, 0, w, h);
  tctx.globalCompositeOperation = 'destination-in';
  tctx.drawImage(processingMask, 0, 0);

  c.save();
  c.globalCompositeOperation = 'destination-out';
  c.drawImage(processingMask, 0, 0);
  c.restore();
  c.drawImage(temp, 0, 0);
}

/* =====================================================================
   LOADING
   ===================================================================== */
async function loadFile(file){
  if (!file || !file.type || !file.type.startsWith('image/')) return;

  const suggestedName = buildDefaultFilename(file.name);
  const url = URL.createObjectURL(file);

  try {
    const img = await loadImageEl(url);

    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const k = Math.min(1, MAX_DIM / Math.max(w, h));
    w = Math.max(1, Math.round(w * k));
    h = Math.max(1, Math.round(h * k));

    origCanvas = document.createElement('canvas');
    origCanvas.width = w; origCanvas.height = h;
    origCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

    workCanvas = document.createElement('canvas');
    workCanvas.width = w; workCanvas.height = h;
    workCanvas.getContext('2d').drawImage(origCanvas, 0, 0);

    maskCanvas = document.createElement('canvas');
    maskCanvas.width = w; maskCanvas.height = h;
    maskPainted = false;

    hasImage = true;
    filenameInput.value = suggestedName;
    updateUI();
    fitView();
    setStatus('Image loaded. Use Auto-Select for a starting mask, or paint manually.');
  } catch (e) {
    console.error(e);
    setStatus('Could not read that image.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* =====================================================================
   BRUSH / MASK PAINTING
   ===================================================================== */
function stamp(x, y, rad){
  const c = workCanvas.getContext('2d');
  if (tool === 'erase'){
    c.save();
    c.globalCompositeOperation = 'destination-out';
    c.beginPath();
    c.arc(x, y, rad, 0, Math.PI * 2);
    c.fill();
    c.restore();
  } else if (tool === 'restore'){
    c.save();
    c.beginPath();
    c.arc(x, y, rad, 0, Math.PI * 2);
    c.clip();
    c.drawImage(origCanvas, x - rad, y - rad, rad * 2, rad * 2, x - rad, y - rad, rad * 2, rad * 2);
    c.restore();
  }
}

function strokeTo(x, y){
  const rad  = clampBrushImage();
  const step = Math.max(1, rad * 0.15);
  if (lastPt){
    const dx = x - lastPt.x, dy = y - lastPt.y;
    const dist = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(dist / step));
    for (let i = 1; i <= n; i++){
      stamp(lastPt.x + (dx * i) / n, lastPt.y + (dy * i) / n, rad);
    }
  } else {
    stamp(x, y, rad);
  }
  lastPt = { x, y };
}

function strokeMaskTo(x, y){
  const rad  = clampBrushImage();
  const step = Math.max(1, rad * 0.15);
  const mctx = maskCanvas.getContext('2d');
  mctx.fillStyle = MASK_TINT;
  const paint = (cx, cy) => {
    mctx.beginPath();
    mctx.arc(cx, cy, rad, 0, Math.PI * 2);
    mctx.fill();
  };
  if (lastPt){
    const dx = x - lastPt.x, dy = y - lastPt.y;
    const dist = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(dist / step));
    for (let i = 1; i <= n; i++){
      paint(lastPt.x + (dx * i) / n, lastPt.y + (dy * i) / n);
    }
  } else {
    paint(x, y);
  }
  lastPt = { x, y };
  if (!maskPainted){ maskPainted = true; updateUI(); }
}

function clearMask(){
  if (!maskCanvas) return;
  maskCanvas.getContext('2d').clearRect(0, 0, maskCanvas.width, maskCanvas.height);
  maskPainted = false;
  updateUI();
  renderOverlay();
}

/* =====================================================================
   POINTER EVENTS
   ===================================================================== */
viewport.addEventListener('pointerdown', (e) => {
  if (!hasImage || busy) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2){
    drawing = false;
    panning = false;
    lastPt  = null;
    primaryPointerId = null;
    const [p1, p2] = [...activePointers.values()];
    const r = viewport.getBoundingClientRect();
    const midX = (p1.x + p2.x) / 2;
    const midY = (p1.y + p2.y) / 2;
    pinchState = {
      startDist:  Math.hypot(p2.x - p1.x, p2.y - p1.y),
      startScale: scale,
      imgMidX:    (midX - r.left - tx) / scale,
      imgMidY:    (midY - r.top  - ty) / scale,
    };
    try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
    return;
  }

  if (activePointers.size > 2) return;
  if (primaryPointerId !== null) return;
  primaryPointerId = e.pointerId;

  const isPan = tool === 'pan' || spaceDown;

  if (isPan){
    panning  = true;
    panStart = { x: e.clientX - tx, y: e.clientY - ty };
    viewport.style.cursor = 'grabbing';
  } else if (tool === 'mask'){
    drawing = true;
    lastPt  = null;
    const p = toImage(e.clientX, e.clientY);
    strokeMaskTo(p.x, p.y);
    scheduleRender();
  } else if (tool === 'erase' || tool === 'restore'){
    drawing = true;
    lastPt  = null;
    const p = toImage(e.clientX, e.clientY);
    strokeTo(p.x, p.y);
    scheduleRender();
  }

  try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});

viewport.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size >= 2 && pinchState){
    const [p1, p2] = [...activePointers.values()];
    const r = viewport.getBoundingClientRect();
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const midX = (p1.x + p2.x) / 2;
    const midY = (p1.y + p2.y) / 2;
    const factor = dist / Math.max(1, pinchState.startDist);
    const ns = Math.min(24, Math.max(0.02, pinchState.startScale * factor));
    scale = ns;
    tx = (midX - r.left) - pinchState.imgMidX * ns;
    ty = (midY - r.top ) - pinchState.imgMidY * ns;
    render();
    renderOverlay();
    return;
  }

  if (activePointers.size > 1) return;
  if (e.pointerId !== primaryPointerId) return;

  const r = viewport.getBoundingClientRect();
  cursor = { x: e.clientX - r.left, y: e.clientY - r.top };

  if (panning){
    tx = e.clientX - panStart.x;
    ty = e.clientY - panStart.y;
    scheduleRender();
    return;
  }

  if (drawing && hasImage){
    const p = toImage(e.clientX, e.clientY);
    if (tool === 'mask') strokeMaskTo(p.x, p.y);
    else strokeTo(p.x, p.y);
    scheduleRender();
    return;
  }

  if (hasImage) renderOverlay();
});

function handlePointerEnd(e){
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchState = null;
  if (e.pointerId === primaryPointerId){
    primaryPointerId = null;
    if (panning || drawing){
      panning = false;
      drawing = false;
      lastPt  = null;
      viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
      renderOverlay();
    }
  }
}
window.addEventListener('pointerup', handlePointerEnd);
window.addEventListener('pointercancel', handlePointerEnd);

viewport.addEventListener('pointerleave', () => {
  if (activePointers.size === 0){ cursor = null; renderOverlay(); }
});

viewport.addEventListener('wheel', (e) => {
  if (!hasImage) return;
  e.preventDefault();
  const r  = viewport.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const factor = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(24, Math.max(0.02, scale * factor));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  render();
  renderOverlay();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' &&
      !(e.target instanceof HTMLInputElement) &&
      !(e.target instanceof HTMLButtonElement)){
    spaceDown = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') spaceDown = false;
});

/* =====================================================================
   MODE / TOOL BUTTONS
   ===================================================================== */
modeBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    maskMode = btn.dataset.mode;
    modeBtns.forEach((b) => b.classList.toggle('active', b === btn));
    updateUI();
    setStatus(maskMode === 'keep'
      ? 'Keep mode: the masked subject will be revealed.'
      : 'Hide mode: the masked subject will be removed.');
  });
});

toolBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    toolBtns.forEach((b) => b.classList.toggle('active', b === btn));
    viewport.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
    renderOverlay();
    if (tool === 'mask')        setStatus('Paint over the subject, or use Auto-Select for a starting mask.');
    else if (tool === 'erase')  setStatus('Drag to erase from the result.');
    else if (tool === 'restore')setStatus('Drag to restore original pixels.');
    else                        setStatus('Drag to pan, scroll or pinch to zoom.');
  });
});

sizeInput.addEventListener('input', () => {
  brushSize = Number(sizeInput.value);
  sizeVal.textContent = brushSize;
  renderOverlay();
});

fitBtn.addEventListener('click', fitView);

clearMaskBtn.addEventListener('click', () => {
  clearMask();
  setStatus('Mask cleared.');
});

resetBtn.addEventListener('click', () => {
  if (!hasImage) return;
  const c = workCanvas.getContext('2d');
  c.clearRect(0, 0, workCanvas.width, workCanvas.height);
  c.drawImage(origCanvas, 0, 0);
  clearMask();
  render();
  setStatus('Reset to the original image.');
});

/* =====================================================================
   DOWNLOAD (uses the editable filename)
   ===================================================================== */
function triggerDownload(){
  if (!hasImage) return;
  const finalName = sanitizeFilename(filenameInput.value);

  workCanvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement('a');
    const href = URL.createObjectURL(blob);
    a.href = href;
    a.download = finalName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(href), 1500);
    setStatus('Downloaded as "' + finalName + '".');
  }, 'image/png');
}

downloadBtn.addEventListener('click', triggerDownload);

// Enter inside the filename field = download
filenameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    e.preventDefault();
    triggerDownload();
  }
});

// Re-sanitize visually if the user typed spaces or invalid chars
filenameInput.addEventListener('blur', () => {
  if (filenameInput.disabled) return;
  filenameInput.value = sanitizeFilename(filenameInput.value).replace(/\.png$/i, '');
});

/* =====================================================================
   INPUT SOURCES
   ===================================================================== */
fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach((ev) =>
  viewport.addEventListener(ev, (e) => e.preventDefault())
);

viewport.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

window.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items){
    if (it.type && it.type.startsWith('image/')){
      const f = it.getAsFile();
      if (f){ loadFile(f); break; }
    }
  }
});

/* =====================================================================
   AI MODEL LOADER
   ===================================================================== */
async function loadRemover(){
  const urls = [
    'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm',
    'https://esm.sh/@imgly/background-removal@1.7.0'
  ];
  for (const url of urls){
    try {
      const mod = await import(/* webpackIgnore: true */ url);
      const removeBackground = mod.removeBackground || mod.default;
      const segmentForeground = mod.segmentForeground;
      if (typeof removeBackground === 'function'){
        return { removeBackground, segmentForeground };
      }
    } catch (err){
      console.warn('CDN failed:', url, err);
    }
  }
  return null;
}

/* =====================================================================
   AUTO-SELECT SUBJECT
   ===================================================================== */
async function autoSelectSubject(){
  if (!hasImage || busy) return;

  busy = true;
  setBusyUI(true);
  setStatus('Generating auto mask…');

  try {
    const api = await loadRemover();
    if (!api || !api.segmentForeground) throw new Error('segmentForeground unavailable');

    const srcBlob = await new Promise(r => origCanvas.toBlob(r, 'image/png'));
    if (!srcBlob) throw new Error('Could not encode image');

    const maskBlob = await api.segmentForeground(srcBlob, {
      output: { format: 'image/png' },
      progress: makeProgressHandler()
    });

    const bmp = await createImageBitmap(maskBlob);

    const mctx = maskCanvas.getContext('2d');
    mctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    mctx.drawImage(bmp, 0, 0, maskCanvas.width, maskCanvas.height);
    if (bmp.close) bmp.close();

    mctx.globalCompositeOperation = 'source-in';
    mctx.fillStyle = MASK_TINT;
    mctx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
    mctx.globalCompositeOperation = 'source-over';

    maskPainted = true;
    updateUI();
    renderOverlay();
    setStatus('Auto mask applied. Refine with the Mask brush if needed, then Apply.');
  } catch (err){
    console.error(err);
    setStatus('Auto-select failed. You can still paint the mask manually.');
  } finally {
    busy = false;
    setBusyUI(false);
    updateUI();
    render();
    renderOverlay();
  }
}

autoSelectBtn.addEventListener('click', autoSelectSubject);

/* =====================================================================
   APPLY — Hide (local erase) or Keep (AI)
   ===================================================================== */
async function doRemoveBackground(){
  if (!hasImage || busy) return;

  // ---------- HIDE MODE ----------
  if (maskPainted && maskMode === 'hide'){
    busy = true;
    setBusyUI(true);
    setStatus('Removing masked subject…');

    await new Promise(r => requestAnimationFrame(r));
    try {
      const processingMask = dilateAndFeatherMask();
      if (!processingMask) throw new Error('Mask preparation failed');

      const c = workCanvas.getContext('2d');
      c.save();
      c.globalCompositeOperation = 'destination-out';
      c.drawImage(processingMask, 0, 0);
      c.restore();

      clearMask();
      setStatus('Masked subject hidden. Refine with Erase / Restore if needed.');
    } finally {
      busy = false;
      setBusyUI(false);
      updateUI();
      render();
      renderOverlay();
    }
    return;
  }

  // ---------- KEEP / NO MASK ----------
  busy = true;
  setBusyUI(true);
  setStatus('Loading AI model (first run downloads ~40 MB)…');

  const downloadNote = setTimeout(() => {
    if (busy) setStatus('Still downloading model files (first run only)…');
  }, 6000);

  try {
    const api = await loadRemover();
    if (!api) throw new Error('Model module unavailable');
    const { removeBackground } = api;

    let aiResultCanvas = null;

    if (maskPainted){
      const bbox = getMaskBoundingBox(AI_CROP_PADDING);
      const cropArea = bbox ? bbox.w * bbox.h : Infinity;
      const fullArea = workCanvas.width * workCanvas.height;

      if (bbox && (cropArea / fullArea) < CROP_THRESHOLD){
        const crop = document.createElement('canvas');
        crop.width = bbox.w; crop.height = bbox.h;
        crop.getContext('2d').drawImage(
          origCanvas, bbox.x, bbox.y, bbox.w, bbox.h, 0, 0, bbox.w, bbox.h
        );

        const srcBlob = await new Promise(r => crop.toBlob(r, 'image/png'));
        if (!srcBlob) throw new Error('Could not encode crop');

        const outBlob = await removeBackground(srcBlob, {
          output:   { format: 'image/png' },
          progress: makeProgressHandler()
        });

        const bmp = await createImageBitmap(outBlob);
        aiResultCanvas = document.createElement('canvas');
        aiResultCanvas.width  = workCanvas.width;
        aiResultCanvas.height = workCanvas.height;
        aiResultCanvas.getContext('2d').drawImage(bmp, bbox.x, bbox.y, bbox.w, bbox.h);
        if (bmp.close) bmp.close();
      }
    }

    if (!aiResultCanvas){
      const srcBlob = await new Promise(r => origCanvas.toBlob(r, 'image/png'));
      if (!srcBlob) throw new Error('Could not encode source');

      const outBlob = await removeBackground(srcBlob, {
        output:   { format: 'image/png' },
        progress: makeProgressHandler()
      });

      const bmp = await createImageBitmap(outBlob);
      aiResultCanvas = document.createElement('canvas');
      aiResultCanvas.width  = workCanvas.width;
      aiResultCanvas.height = workCanvas.height;
      aiResultCanvas.getContext('2d').drawImage(bmp, 0, 0, aiResultCanvas.width, aiResultCanvas.height);
      if (bmp.close) bmp.close();
    }

    if (maskPainted){
      const ok = hasOpaqueInsideMask(aiResultCanvas, maskCanvas, AI_MIN_OPAQUE);
      if (!ok){
        clearMask();
        setStatus('AI returned no foreground — original preserved. Try a different subject, or use Hide mode.');
        return;
      }
    }

    if (maskPainted){
      const processingMask = dilateAndFeatherMask();
      compositeWithMask(aiResultCanvas, processingMask);
      clearMask();
      setStatus('Masked subject kept. Refine or mask another area.');
    } else {
      const alphaMask = getCurrentAlphaMask();
      compositeWithMask(aiResultCanvas, alphaMask);
      setStatus('Background removed. Use Erase / Restore to fine-tune.');
    }
  } catch (err){
    console.error(err);
    setStatus('AI model unavailable — running built-in fallback…');
    await quickRemove();
  } finally {
    clearTimeout(downloadNote);
    busy = false;
    setBusyUI(false);
    updateUI();
    render();
    renderOverlay();
  }
}

/* =====================================================================
   FALLBACK — Worker flood fill with validation
   ===================================================================== */
function quickRemove(){
  return new Promise((resolve) => {
    const w = origCanvas.width;
    const h = origCanvas.height;
    const imageData = origCanvas.getContext('2d').getImageData(0, 0, w, h);
    const data = imageData.data;

    let br = 0, bg = 0, bb = 0, n = 0;
    const acc = (i) => { br += data[i]; bg += data[i + 1]; bb += data[i + 2]; n++; };
    for (let x = 0; x < w; x++){ acc(x * 4); acc(((h - 1) * w + x) * 4); }
    for (let y = 0; y < h; y++){ acc((y * w) * 4); acc((y * w + w - 1) * 4); }
    br /= n; bg /= n; bb /= n;

    const workerCode = `
      self.onmessage = function(e){
        const { buf, width, height, br, bg, bb } = e.data;
        const d = new Uint8ClampedArray(buf);
        const palTol = 38, palTol2 = palTol*palTol*3;
        const gradTol = 22, gradTol2 = gradTol*gradTol*3;
        const seen = new Uint8Array(width*height);
        const stack = [];
        const match = (i) => {
          const p = i*4;
          const dr = d[p]-br, dg = d[p+1]-bg, db = d[p+2]-bb;
          return (dr*dr+dg*dg+db*db) <= palTol2;
        };
        const close = (i,j) => {
          const a = i*4, b = j*4;
          const dr = d[a]-d[b], dg = d[a+1]-d[b+1], db = d[a+2]-d[b+2];
          return (dr*dr+dg*dg+db*db) <= gradTol2;
        };
        const push = (i, from) => {
          if (seen[i]) return;
          if (!match(i)) return;
          if (from !== null && !close(i, from)) return;
          seen[i] = 1;
          stack.push(i);
        };
        for (let x = 0; x < width; x++){ push(x, null); push((height-1)*width+x, null); }
        for (let y = 0; y < height; y++){ push(y*width, null); push(y*width+width-1, null); }
        while (stack.length){
          const i = stack.pop();
          d[i*4+3] = 0;
          const x = i % width, y = (i/width)|0;
          if (x > 0) push(i-1, i);
          if (x < width-1) push(i+1, i);
          if (y > 0) push(i-width, i);
          if (y < height-1) push(i+width, i);
        }
        self.postMessage({ buf: d.buffer }, [d.buffer]);
      };
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);
    const worker = new Worker(workerUrl);

    worker.onmessage = (ev) => {
      const newData = new Uint8ClampedArray(ev.data.buf);

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = w; srcCanvas.height = h;
      srcCanvas.getContext('2d').putImageData(new ImageData(newData, w, h), 0, 0);

      if (maskPainted){
        const ok = hasTransparentInsideMask(srcCanvas, maskCanvas, FB_MIN_TRANSPARENT);
        if (!ok){
          clearMask();
          setStatus('Fallback could not remove background inside mask — original preserved.');
        } else {
          const processingMask = dilateAndFeatherMask();
          compositeWithMask(srcCanvas, processingMask);
          clearMask();
          setStatus('Masked subject processed (fallback). Refine with Erase / Restore.');
        }
      } else {
        const alphaMask = getCurrentAlphaMask();
        compositeWithMask(srcCanvas, alphaMask);
        setStatus('Quick removal applied (fallback). Refine with Erase / Restore.');
      }

      worker.terminate();
      URL.revokeObjectURL(workerUrl);
      render();
      resolve();
    };

    worker.onerror = (err) => {
      console.error('Worker error:', err);
      worker.terminate();
      URL.revokeObjectURL(workerUrl);
      setStatus('Fallback removal failed.');
      resolve();
    };

    const buf = data.buffer;
    worker.postMessage({ buf, width: w, height: h, br, bg, bb }, [buf]);
  });
}

/* =====================================================================
   INIT
   ===================================================================== */
removeBtn.addEventListener('click', doRemoveBackground);
viewport.style.cursor = 'grab';
window.addEventListener('resize', resize);

resize();
updateUI();
setStatus('Load an image to begin.');
</script>
